name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The build only reads the code; the deploy uses its own Firebase key.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: No known vulnerabilities in shipped code
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Rules and pairing tests (local emulators)
        working-directory: backend-tests
        run: |
          npm ci
          npm test
          npm run e2e

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: No known vulnerabilities in shipped code
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk mytechkid-beta.apk
      # Mom's app reads this to know a newer build is ready (Updater.kt).
      - run: |
          echo "{\"versionCode\": $GITHUB_RUN_NUMBER}" > version.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mytechkid-beta-apk
          path: |
            android/mytechkid-beta.apk
            android/version.json

  iphone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iphone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      # Generates the Xcode project the way Expo's cloud build will, so a
      # broken app.json or plugin shows up here instead of in a paid build.
      - run: npx expo prebuild --platform ios --no-install

  # Publishes the backend, the helper web app and Mom's app download.
  # Skipped until the FIREBASE_SERVICE_ACCOUNT secret is added (docs/SETUP.md).
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, web, android]
    runs-on: ubuntu-latest
    # One publish at a time, so an older build can never overwrite a newer one.
    concurrency:
      group: deploy-firebase
      cancel-in-progress: false
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # Optional: the screen-sharing relay (docs/STAGE2.md). Without them,
      # sharing uses direct connections only.
      TURN_KEY_ID: ${{ secrets.CLOUDFLARE_TURN_KEY_ID }}
      TURN_API_TOKEN: ${{ secrets.CLOUDFLARE_TURN_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check setup
        id: ready
        run: |
          if [ -z "$FIREBASE_SA" ] || grep -q "YOUR-FIREBASE-PROJECT-ID" .firebaserc; then
            echo "Firebase isn't set up yet; skipping deploy (see docs/SETUP.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.ready.outputs.ok == 'true'
        with:
          name: web-dist
          path: web/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.ready.outputs.ok == 'true'
        with:
          name: mytechkid-beta-apk
          path: web/dist/download
      - name: Deploy to Firebase
        if: steps.ready.outputs.ok == 'true'
        run: |
          (cd functions && npm ci)
          if [ -n "$TURN_KEY_ID" ] && [ -n "$TURN_API_TOKEN" ]; then
            printf '\nCLOUDFLARE_TURN_KEY_ID=%s\nCLOUDFLARE_TURN_API_TOKEN=%s\n' "$TURN_KEY_ID" "$TURN_API_TOKEN" >> functions/.env.my-tech-kid
          else
            echo "No relay secrets yet; screen sharing will use direct connections only."
          fi
          echo "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 deploy --only hosting,functions,firestore --non-interactive --force
