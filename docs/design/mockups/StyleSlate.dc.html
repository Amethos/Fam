<div style="display: flex; align-items: center; justify-content: space-between">

<div style="background: #FFFFFF; border: 1px solid #E0E3E7; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px">

<p style="margin: 0; font-size: 1rem; line-height: 1.45; color: #2B3036">"Your package could not be delivered. Pay the $1.99 fee…"</p>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">

<div style="background: #FFFFFF; border: 1px solid #E0E3E7; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 0.8125rem; color: #5D646C">Remote control</span>
<strong style="font-weight: 600">Thu 2:45 PM</strong>

</div>

<button type="button" style="margin-top: auto; font: inherit; font-weight: 600; font-size: 1rem; background: #16181B; color: #FFFFFF; border: 0; border-radius: 10px; min-height: 52px">Add Mom or Dad</button>
